<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="880" viewBox="0 0 1420 880" font-family="DejaVu Sans, Liberation Sans, sans-serif"><rect width="1420" height="880" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker></defs><text x="32" y="40" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" fill="#0b0b0b" font-weight="bold" text-anchor="start">A framework for honest computation in complex biology</text><text x="32" y="64" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start">Five layers that are routinely collapsed into one number, the gate that separates them, and three studies that test it.</text><text x="32" y="104" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">A · THE EPISTEMIC LADDER</text><rect x="32" y="118" width="232" height="96" rx="8" fill="#f6f6f4" stroke="#2a78d6" stroke-width="2"/><text x="48" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="start">KNOWLEDGE</text><text x="48" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a review article,</text><text x="48" y="185" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a guideline, a hallmark</text><text x="278.0" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="middle">≠</text><rect x="292" y="118" width="232" height="96" rx="8" fill="#f6f6f4" stroke="#2a78d6" stroke-width="2"/><text x="308" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="start">EVIDENCE</text><text x="308" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a measurement in</text><text x="308" y="185" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a stated protocol</text><text x="538.0" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="middle">≠</text><rect x="552" y="118" width="232" height="96" rx="8" fill="#f6f6f4" stroke="#4a3aa7" stroke-width="2"/><text x="568" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#4a3aa7" font-weight="bold" text-anchor="start">MECHANISM</text><text x="568" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a hypothesis with</text><text x="568" y="185" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a named falsifier</text><rect x="812" y="118" width="232" height="96" rx="8" fill="#f6f6f4" stroke="#eb6834" stroke-width="2"/><text x="828" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#eb6834" font-weight="bold" text-anchor="start">PARAMETER</text><text x="828" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a number with</text><text x="828" y="185" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">physical meaning</text><text x="1058.0" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="middle">≠</text><rect x="1072" y="118" width="232" height="96" rx="8" fill="#f6f6f4" stroke="#e34948" stroke-width="2"/><text x="1088" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#e34948" font-weight="bold" text-anchor="start">PREDICTION</text><text x="1088" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a claim about</text><text x="1088" y="185" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">a person</text><line x1="798.0" y1="104" x2="798.0" y2="258" stroke="#e34948" stroke-width="2.5" stroke-dasharray="7 5"/><text x="798.0" y="96" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#e34948" font-weight="bold" text-anchor="middle">THE GATE</text><text x="788.0" y="254" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="end" font-style="italic">everything left of the line is argument</text><text x="808.0" y="254" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">everything right of it is a number someone will act on</text><text x="32" y="282" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">B · THESIS #2  —  THE GATE NEVER OPENS</text><rect x="32" y="292" width="442" height="486" rx="8" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="52" y="324" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">A data-only research object</text><text x="52" y="346" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">A contributor writes one YAML CaseCard: disease framing,</text><text x="52" y="361" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">systemic axes, research-only observables, candidate</text><text x="52" y="376" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">mechanisms, falsifiers, qualitative NSTG constraints,</text><text x="52" y="391" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">and Vancouver citations. No solver is edited.</text><rect x="52" y="420" width="402" height="46" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text x="66" y="440" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">CaseCard (YAML)</text><text x="66" y="457" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">knowledge + evidence pointers</text><line x1="253.0" y1="466" x2="253.0" y2="480" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><rect x="52" y="482" width="402" height="46" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.6"/><text x="66" y="502" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Parameter-smuggling scan</text><text x="66" y="519" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">refuses doses, EC50, rate constants, ODE knobs</text><line x1="253.0" y1="528" x2="253.0" y2="542" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><rect x="52" y="544" width="402" height="46" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.6"/><text x="66" y="564" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">NSTG constraint layer</text><text x="66" y="581" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">themes only — never a coefficient</text><line x1="253.0" y1="590" x2="253.0" y2="604" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><rect x="52" y="606" width="402" height="46" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.6"/><text x="66" y="626" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">PathwaySketch</text><text x="66" y="643" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">ranked hypotheses + evidence still required</text><rect x="52" y="680" width="402" height="76" rx="8" fill="#fdeeea" stroke="#e34948" stroke-width="1.8"/><text x="66" y="704" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">Always emitted, even for a clean card:</text><text x="66" y="724" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#e34948" font-weight="normal" text-anchor="start">refused: nstg_scale   ·   refused: parameter</text><text x="66" y="739" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#e34948" font-weight="normal" text-anchor="start">refused: prediction</text><text x="498" y="282" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">C · THESIS #3  —  THE GATE MADE COMPUTABLE</text><rect x="498" y="292" width="442" height="486" rx="8" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="518" y="324" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">When may a parameter be admitted?</text><text x="518" y="346" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">A refusal by rule is safe but sterile. The rule is replaced</text><text x="518" y="361" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">by three tests, run against a declared experiment:</text><text x="518" y="376" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">observables, sample times, noise, arms.</text><rect x="518" y="418" width="402" height="50" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/><circle cx="544" cy="443" r="13" fill="#0b0b0b"/><text x="544" y="448" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="568" y="439" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">STRUCTURAL</text><text x="568" y="457" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">is θⱼ off the null space of S?</text><rect x="518" y="482" width="402" height="50" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/><circle cx="544" cy="507" r="13" fill="#0b0b0b"/><text x="544" y="512" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="568" y="503" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">PRACTICAL</text><text x="568" y="521" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">is the Cramér–Rao CV bound &lt; 0.10?</text><rect x="518" y="546" width="402" height="50" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/><circle cx="544" cy="571" r="13" fill="#0b0b0b"/><text x="544" y="576" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="568" y="567" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">SHAPE</text><text x="568" y="585" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">does Δχ² cross 3.84 on both sides?</text><rect x="518" y="618" width="402" height="112" rx="8" fill="#eafaf3" stroke="#1baf7a" stroke-width="1.8"/><text x="532" y="642" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Tested on a tumour / T-cell / glucose model</text><text x="532" y="664" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">Tumour counts alone: the kill rate is structurally</text><text x="532" y="679" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">invisible — a symmetry no sample size can break.</text><text x="532" y="694" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">Measure glucose and T cells: 4 of 8 admitted.</text><text x="532" y="709" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">The kill rate stays refused in every design.</text><text x="964" y="282" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">D · THESIS #4  —  THE SAME GATE, A REAL PROTOCOL</text><rect x="964" y="292" width="442" height="486" rx="8" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="984" y="324" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">What does a blood film allow?</text><text x="984" y="346" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Artemisinin partial resistance is surveilled worldwide by</text><text x="984" y="361" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">the parasite clearance half-life, and read as a statement</text><text x="984" y="376" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">about ring-stage drug killing. The same code judges it.</text><rect x="984" y="418" width="402" height="92" rx="8" fill="#fdeeea" stroke="#e34948" stroke-width="1.8"/><text x="998" y="442" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">The summary is degenerate</text><text x="998" y="462" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">One half-life of 3.1 h is produced by a 50-fold range</text><text x="998" y="477" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">of ring-stage killing, once the time the patient</text><text x="998" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">presented is free to vary.</text><rect x="984" y="526" width="402" height="92" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.8"/><text x="998" y="550" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">The routine protocol admits nothing</text><text x="998" y="570" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">6-hourly films, 48 h, realistic counting error:</text><text x="998" y="585" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">0 of 8 parameters admissible. Ring-stage killing</text><text x="998" y="600" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">has a CV bound of 1.63 — wider than the quantity.</text><rect x="984" y="634" width="402" height="122" rx="8" fill="#eafaf3" stroke="#1baf7a" stroke-width="1.8"/><text x="998" y="658" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">What the curve does measure</text><text x="998" y="678" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Sequestration age and the parasite age at</text><text x="998" y="693" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">presentation — the observation process, not the drug.</text><text x="998" y="708" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">So the half-life is a population screening signal,</text><text x="998" y="723" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">and the phenotype needs a ring-stage assay.</text><line x1="32" y1="838" x2="1388" y2="838" stroke="#d6d5d0"/><text x="32" y="860" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">Every verdict and number above is read from the committed results files, not typed by hand. Computational research only — not a medical device, not clinical decision support, not treatment guidance.</text></svg>