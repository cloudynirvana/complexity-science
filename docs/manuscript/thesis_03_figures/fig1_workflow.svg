<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="DejaVu Sans, Liberation Sans, sans-serif"><rect width="1240" height="700" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker></defs><text x="28" y="34" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">The evidence gate: from a declared measurement to an admissible parameter</text><text x="28" y="56" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">A parameter leaves “refused” only for a stated experiment. Change the observables and the verdict changes.</text><text x="28" y="92" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">INPUTS</text><rect x="28" y="102" width="262" height="92" rx="7" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="44" y="126" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Mechanistic model</text><text x="44" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">dG/dt, dT/dt, dE/dt</text><text x="44" y="168" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">parameter vector θ  (8 entries)</text><text x="44" y="186" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">no value fitted to data</text><rect x="28" y="212" width="262" height="112" rx="7" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="44" y="236" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Declared experiment</text><text x="44" y="258" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">observables ⊆ {T, G, E}</text><text x="44" y="278" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">sample times · noise σ · seeding arms</text><text x="44" y="300" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">declared up front, not after the fit</text><text x="44" y="352" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start">Sensitivity matrix</text><text x="44" y="372" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">S = ∂ log y / ∂ log θ</text><text x="44" y="392" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">F = SᵀS / σ²</text><line x1="159" y1="194" x2="159" y2="208" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><line x1="159" y1="324" x2="159" y2="334" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><line x1="290" y1="372" x2="320" y2="372" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/><text x="330" y="92" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">THE GATE  — all three must pass</text><rect x="330" y="102" width="300" height="82" rx="7" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/><circle cx="354" cy="127" r="13" fill="#0b0b0b"/><text x="354" y="132" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="376" y="125" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">STRUCTURAL</text><text x="376" y="144" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start">Is θⱼ off the null space of S?</text><text x="376" y="165" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">a symmetry no sample size can break</text><rect x="330" y="212" width="300" height="82" rx="7" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/><circle cx="354" cy="237" r="13" fill="#0b0b0b"/><text x="354" y="242" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="376" y="235" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">PRACTICAL</text><text x="376" y="254" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start">Is CV = √(F⁻¹)ⱼⱼ &lt; 0.10?</text><text x="376" y="275" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">Cramér–Rao bound at the declared σ</text><rect x="330" y="322" width="300" height="82" rx="7" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/><circle cx="354" cy="347" r="13" fill="#0b0b0b"/><text x="354" y="352" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="376" y="345" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="bold" text-anchor="start">SHAPE</text><text x="376" y="364" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="start">Does Δχ² cross 3.84 both sides?</text><text x="376" y="385" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">profile likelihood, not a local bound</text><line x1="480.0" y1="184" x2="480.0" y2="210" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><text x="488.0" y="204" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">pass</text><line x1="480.0" y1="294" x2="480.0" y2="320" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><text x="488.0" y="314" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">pass</text><line x1="480.0" y1="404" x2="480.0" y2="430" stroke="#0b0b0b" stroke-width="1.8" marker-end="url(#a)"/><text x="488.0" y="424" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">pass</text><rect x="382" y="430" width="226" height="44" rx="10" fill="#eafaf3" stroke="#1baf7a" stroke-width="2"/><text x="495" y="458" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="14" fill="#0b0b0b" font-weight="bold" text-anchor="middle">ADMISSIBLE PARAMETER</text><text x="495" y="500" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="middle" text-anchor="start">May now be estimated — for this experiment only.</text><text x="495" y="520" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="middle">Knowledge ≠ Evidence ≠ Mechanism ≠ Parameter ≠ Prediction</text><line x1="630" y1="143" x2="666" y2="143" stroke="#52514e" stroke-width="1.8" marker-end="url(#a)"/><text x="634" y="135" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">fail</text><rect x="670" y="126" width="152" height="34" rx="17" fill="#ffffff" stroke="#e34948" stroke-width="1.8"/><circle cx="689" cy="143" r="11" fill="#e34948"/><text x="689" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">S</text><text x="707" y="148" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">structural</text><line x1="630" y1="253" x2="666" y2="253" stroke="#52514e" stroke-width="1.8" marker-end="url(#a)"/><text x="634" y="245" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">fail</text><rect x="670" y="236" width="152" height="34" rx="17" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><circle cx="689" cy="253" r="11" fill="#eb6834"/><text x="689" y="258" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><text x="707" y="258" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">practical</text><line x1="630" y1="363" x2="666" y2="363" stroke="#52514e" stroke-width="1.8" marker-end="url(#a)"/><text x="634" y="355" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">fail</text><rect x="670" y="346" width="152" height="34" rx="17" fill="#ffffff" stroke="#eda100" stroke-width="1.8"/><circle cx="689" cy="363" r="11" fill="#eda100"/><text x="689" y="368" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="707" y="368" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">one-sided</text><text x="848" y="92" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">WORKED VERDICT — tumour / effector / glucose model</text><rect x="848" y="102" width="392" height="300" rx="7" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="1044" y="126" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="middle">What each measurement set admits</text><text x="1116" y="149" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="middle">{T}</text><text x="1182" y="149" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="middle">{T,G,E}</text><text x="864" y="149" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start">measured:</text><rect x="858" y="164" width="372" height="27" rx="4" fill="#ffffff"/><text x="868" y="183" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">u  tumour glucose uptake</text><rect x="1105" y="168" width="22" height="19" rx="4" fill="#eb6834"/><text x="1116" y="183" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="1171" y="168" width="22" height="19" rx="4" fill="#1baf7a"/><text x="1182" y="183" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">O</text><text x="868" y="212" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">v  effector glucose uptake</text><rect x="1105" y="197" width="22" height="19" rx="4" fill="#e34948"/><text x="1116" y="212" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">S</text><rect x="1171" y="197" width="22" height="19" rx="4" fill="#eb6834"/><text x="1182" y="212" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="858" y="222" width="372" height="27" rx="4" fill="#ffffff"/><text x="868" y="241" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">d  tumour loss</text><rect x="1105" y="226" width="22" height="19" rx="4" fill="#eb6834"/><text x="1116" y="241" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="1171" y="226" width="22" height="19" rx="4" fill="#1baf7a"/><text x="1182" y="241" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">O</text><text x="868" y="270" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">k  effector kill rate</text><rect x="1105" y="255" width="22" height="19" rx="4" fill="#e34948"/><text x="1116" y="270" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">S</text><rect x="1171" y="255" width="22" height="19" rx="4" fill="#eb6834"/><text x="1182" y="270" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="858" y="280" width="372" height="27" rx="4" fill="#ffffff"/><text x="868" y="299" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">h  effector fuel half-sat.</text><rect x="1105" y="284" width="22" height="19" rx="4" fill="#eb6834"/><text x="1116" y="299" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="1171" y="284" width="22" height="19" rx="4" fill="#eb6834"/><text x="1182" y="299" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><text x="868" y="328" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">s  effector influx</text><rect x="1105" y="313" width="22" height="19" rx="4" fill="#e34948"/><text x="1116" y="328" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">S</text><rect x="1171" y="313" width="22" height="19" rx="4" fill="#1baf7a"/><text x="1182" y="328" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">O</text><rect x="858" y="338" width="372" height="27" rx="4" fill="#ffffff"/><text x="868" y="357" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">b  antigen-driven expansion</text><rect x="1105" y="342" width="22" height="19" rx="4" fill="#eb6834"/><text x="1116" y="357" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="1171" y="342" width="22" height="19" rx="4" fill="#eb6834"/><text x="1182" y="357" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><text x="868" y="386" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">m  effector loss</text><rect x="1105" y="371" width="22" height="19" rx="4" fill="#eb6834"/><text x="1116" y="386" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><rect x="1171" y="371" width="22" height="19" rx="4" fill="#1baf7a"/><text x="1182" y="386" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">O</text><text x="848" y="430" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">Tumour counts alone admit nothing. Measuring glucose</text><text x="848" y="449" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">and effectors admits 4 of 8.</text><text x="848" y="474" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">The kill rate k is refused in every design —</text><text x="848" y="493" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">the parameter most often fitted in practice.</text><text x="848" y="528" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">VERDICTS</text><rect x="848" y="540" width="22" height="19" rx="4" fill="#e34948"/><text x="859" y="554" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">S</text><text x="880" y="554" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">structural — structurally invisible</text><rect x="848" y="564" width="22" height="19" rx="4" fill="#eb6834"/><text x="859" y="578" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">P</text><text x="880" y="578" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">practical — bound too wide</text><rect x="848" y="588" width="22" height="19" rx="4" fill="#eda100"/><text x="859" y="602" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="880" y="602" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">one sided profile — one-sided interval</text><rect x="848" y="612" width="22" height="19" rx="4" fill="#1baf7a"/><text x="859" y="626" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">O</text><text x="880" y="626" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">open — admissible</text><line x1="28" y1="662" x2="1212" y2="662" stroke="#d6d5d0" stroke-width="1"/><text x="28" y="682" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">Computational research only. Not a medical device, not clinical decision support, not dosing advice.</text></svg>