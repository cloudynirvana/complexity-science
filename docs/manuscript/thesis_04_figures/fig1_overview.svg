<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="DejaVu Sans, Liberation Sans, sans-serif"><rect width="1240" height="700" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="28" y="34" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">What a parasite clearance curve can and cannot measure</text><text x="28" y="56" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#52514e" font-weight="normal" text-anchor="start">The 48-hour cycle, the blood film that samples it, and the verdict of the evidence gate.</text><text x="28" y="92" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">A · WITHIN-HOST CYCLE</text><rect x="28" y="102" width="372" height="250" rx="7" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><circle cx="150" cy="222" r="74" fill="none" stroke="#d6d5d0" stroke-width="22"/><path d="M 150 148 A 74 74 0 0 1 224 222" fill="none" stroke="#2a78d6" stroke-width="22"/><path d="M 224 222 A 74 74 0 0 1 150 296" fill="none" stroke="#4a3aa7" stroke-width="22"/><text x="150" y="218" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle">48 h</text><text x="150" y="238" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="middle" text-anchor="start">cycle</text><text x="164" y="136" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">0 h  invasion</text><text x="230" y="208" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">26 h</text><text x="146" y="318" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="middle">48 h  burst × PMR</text><circle cx="258" cy="152" r="7" fill="#2a78d6"/><text x="272" y="157" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">rings — circulate</text><text x="272" y="175" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">visible on a blood film</text><circle cx="258" cy="206" r="7" fill="#4a3aa7"/><text x="272" y="211" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">mature — sequester</text><text x="272" y="229" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">invisible to microscopy</text><text x="258" y="268" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">Artemisinin kills stage-</text><text x="258" y="285" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="normal" text-anchor="start">specifically. Partial</text><text x="258" y="302" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">resistance = rings survive.</text><text x="44" y="330" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">The film counts the circulating fraction only.</text><text x="430" y="92" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">B · WHAT IS MEASURED</text><rect x="430" y="102" width="330" height="250" rx="7" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="446" y="128" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Standard protocol</text><text x="446" y="150" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">6-hourly blood films to 48 h</text><text x="446" y="170" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">counting error σ ≈ 0.20</text><text x="446" y="196" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Reported phenotype</text><text x="446" y="218" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">clearance half-life t₁₂ — the slope</text><text x="446" y="236" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">of the log-linear decline</text><rect x="446" y="254" width="298" height="76" rx="8" fill="#fdeeea" stroke="#e34948" stroke-width="1.8"/><text x="460" y="278" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">t₁₂ = 3.1 h is compatible with a</text><text x="460" y="298" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">50-fold range of ring-stage killing,</text><text x="460" y="318" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">once staging is allowed to vary.</text><line x1="400" y1="227" x2="424" y2="227" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/><line x1="760" y1="227" x2="784" y2="227" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a)"/><text x="790" y="92" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="bold" text-anchor="start">C · EVIDENCE GATE</text><rect x="790" y="102" width="422" height="250" rx="7" fill="#f6f6f4" stroke="#d6d5d0" stroke-width="1.4"/><text x="806" y="128" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13.5" fill="#0b0b0b" font-weight="bold" text-anchor="start">Is the parameter admissible?</text><circle cx="818" cy="152" r="10" fill="#0b0b0b"/><text x="818" y="156" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="836" y="156" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">structural — off the null space of S</text><circle cx="818" cy="182" r="10" fill="#0b0b0b"/><text x="818" y="186" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="836" y="186" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">practical — CV bound &lt; 0.10</text><circle cx="818" cy="212" r="10" fill="#0b0b0b"/><text x="818" y="216" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="836" y="216" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#0b0b0b" font-weight="normal" text-anchor="start">shape — profile two-sided at 95%</text><text x="806" y="262" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">Same gate, same code as Thesis #3.</text><text x="806" y="284" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">The verdict belongs to the measurement</text><text x="806" y="302" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">design, not to the biology.</text><text x="806" y="330" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11.5" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">No parameter is fitted to patient data.</text><text x="28" y="400" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="bold" text-anchor="start">VERDICT — ring-stage killing rate k_ring, the parameter that defines artemisinin partial resistance</text><rect x="28" y="418" width="222" height="118" rx="9" fill="#ffffff" stroke="#e34948" stroke-width="2"/><text x="42" y="442" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">6-hourly films to 48 h</text><text x="42" y="460" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start">9 observations · σ 0.20</text><text x="42" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" fill="#e34948" font-weight="bold" text-anchor="start">CV  1.63</text><text x="42" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#e34948" font-weight="bold" text-anchor="start">REFUSED</text><text x="236" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="end">0/8 admissible</text><rect x="264" y="418" width="222" height="118" rx="9" fill="#ffffff" stroke="#e34948" stroke-width="2"/><text x="278" y="442" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">4-hourly films to 72 h</text><text x="278" y="460" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start">19 observations · σ 0.20</text><text x="278" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" fill="#e34948" font-weight="bold" text-anchor="start">CV  0.66</text><text x="278" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#e34948" font-weight="bold" text-anchor="start">REFUSED</text><text x="472" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="end">1/8 admissible</text><rect x="500" y="418" width="222" height="118" rx="9" fill="#ffffff" stroke="#e34948" stroke-width="2"/><text x="514" y="442" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">6-hourly films + stage</text><text x="514" y="460" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start">18 observations · σ 0.20</text><text x="514" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" fill="#e34948" font-weight="bold" text-anchor="start">CV  1.24</text><text x="514" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#e34948" font-weight="bold" text-anchor="start">REFUSED</text><text x="708" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="end">1/8 admissible</text><rect x="736" y="418" width="222" height="118" rx="9" fill="#ffffff" stroke="#e34948" stroke-width="2"/><text x="750" y="442" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">4-hourly + stage, 72 h</text><text x="750" y="460" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start">38 observations · σ 0.20</text><text x="750" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" fill="#e34948" font-weight="bold" text-anchor="start">CV  0.56</text><text x="750" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#e34948" font-weight="bold" text-anchor="start">REFUSED</text><text x="944" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="end">2/8 admissible</text><rect x="972" y="418" width="222" height="118" rx="9" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/><text x="986" y="442" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#0b0b0b" font-weight="bold" text-anchor="start">2-hourly + biomass, σ 5%</text><text x="986" y="460" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="start">147 observations · σ 0.05</text><text x="986" y="492" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="20" fill="#1baf7a" font-weight="bold" text-anchor="start">CV  0.03</text><text x="986" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12.5" fill="#1baf7a" font-weight="bold" text-anchor="start">ADMISSIBLE</text><text x="1180" y="516" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="10.5" fill="#52514e" font-weight="normal" text-anchor="end">7/8 admissible</text><text x="28" y="572" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start">The curve determines when the infection started and how parasites sequester. It does not determine how well the drug kills rings.</text><text x="28" y="596" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">k_ring becomes admissible only in the idealised design, which needs total parasite biomass — not observable in a patient — and a counting precision light microscopy cannot reach.</text><text x="28" y="618" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">Practical reading: treat the half-life as a population screening signal, and measure resistance with a ring-stage survival assay or kelch13 genotype.</text><line x1="28" y1="662" x2="1212" y2="662" stroke="#d6d5d0"/><text x="28" y="682" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start" font-style="italic">Computational research on a mathematical model. Not a medical device, not clinical decision support, not treatment guidance.</text></svg>