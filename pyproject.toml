[project]
name = "complexity-science"
version = "0.1.0"
description = "NSTG-guided in-silico complexity science: pathology dynamics and constrained biologic pathway search. Research software only — not a medical device."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Complexity Science contributors" }]
keywords = [
  "complexity-science",
  "dynamical-systems",
  "in-silico",
  "pathology-dynamics",
  "research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
plots = ["matplotlib>=3.8"]

[project.scripts]
complexity-science = "complexity_science.cli:main"

[project.urls]
Homepage = "https://github.com/cloudynirvana/complexity-science"
Documentation = "https://github.com/cloudynirvana/complexity-science#readme"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["complexity_science*"]

[tool.setuptools.package-data]
complexity_science = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
