schema_version: "1.0.0"
id: gbm_invasive_niche_hypoxia
title: Glioblastoma — invasive niche and hypoxia
disease:
  name: Glioblastoma
  abbreviations: [GBM]
  framing: >-
    Research framing of an infiltrative primary brain tumour whose hypoxic
    and invasive niches are hypothesized to couple survival, migration, and
    treatment escape. Not a neurosurgical plan and not a person-level profile.
  notes: >-
    Pseudopalisading necrosis and microvascular proliferation are histological
    hallmarks used here as observables, not as model states.
disclaimer: >-
  In-silico / computational research only. Not a medical device, not
  clinical decision support, not dosing advice, and not a cure. NSTG is a
  structured clinical-knowledge constraint layer and is never
  auto-translated into model parameters. Knowledge ≠ Evidence ≠ Mechanism ≠
  Parameter ≠ Prediction.
systemic_axes:
  - id: hypoxic_niche
    layer: hypoxia
    role: driver
    description: >-
      Pseudopalisading necrosis marks a hypoxic compartment hypothesized to
      maintain adaptive programmes and local invasion.
  - id: infiltrative_front
    layer: invasion
    role: driver
    description: >-
      Dispersive glioma cells can trade bulk proliferation for migration,
      limiting local control even when a mass is reduced.
  - id: angiogenic_compartment
    layer: vasculature
    role: context
    description: >-
      Microvascular proliferation coexists with poor effective perfusion;
      vessel quantity is not delivery.
  - id: host_supportive_context
    layer: host
    role: constraint
    description: >-
      Supportive-care, infection, and referral themes from NSTG-adjacent
      national guidance constrain exploration of systemic classes.
observables:
  - id: pseudopalisade_hypoxia
    name: Pseudopalisading necrosis / hypoxia marks
    modality: histopathology and hypoxia immunohistochemistry (research)
    research_only: true
    notes: A niche label, not an oxygen-tension parameter.
  - id: invasive_margin
    name: Infiltrative margin beyond contrast-enhancing mass
    modality: imaging plus histology correlation (research)
    research_only: true
    notes: Extent of infiltration is an observable, not a motility coefficient.
candidate_mechanisms:
  - id: hypoxia_drives_adaptive_invasion
    biologic_axis: hypoxia_adaptation
    status: hypothesis
    supporting_citation_ids: [hambardzumyan2015, brat2004, semenza2012]
    nstg_touchpoint_ids: [nstg_supportive_referral]
    statement: >-
      Hypoxic GBM niches are a candidate mechanism that couples adaptive
      survival programmes to an actively migrating cell population at
      pseudopalisades.
  - id: invasion_proliferation_tradeoff
    biologic_axis: invasive_niche
    status: hypothesis
    supporting_citation_ids: [giese2003, hambardzumyan2015]
    nstg_touchpoint_ids: [nstg_palliative]
    statement: >-
      An invasive niche may be maintained by a migration–proliferation
      trade-off, so reducing a bulk mass need not extinguish infiltrative
      cells.
  - id: vessel_count_is_not_delivery
    biologic_axis: vascular_delivery
    status: hypothesis
    supporting_citation_ids: [hambardzumyan2015, brat2004]
    nstg_touchpoint_ids: [nstg_anaemia]
    statement: >-
      Microvascular proliferation can coexist with ineffective perfusion;
      host anaemia themes further caution against treating vessel counts as
      a delivery parameter.
falsifiers:
  - id: hypoxic_but_nonmigratory
    mechanism_ids: [hypoxia_drives_adaptive_invasion]
    if_observed: >-
      Pseudopalisades are hypoxic yet the surrounding cells are non-migratory
      and lack extracellular-matrix protease programmes.
    then_reject: >-
      Hypoxia as a sufficient driver of the invasive niche in that specimen.
  - id: mass_reduction_clears_infiltrate
    mechanism_ids: [invasion_proliferation_tradeoff]
    if_observed: >-
      Reducing proliferative bulk also clears the infiltrative front in an
      orthogonal model without a change in motility programmes.
    then_reject: >-
      A necessary migration–proliferation trade-off for residual infiltrate.
  - id: more_vessels_more_delivery
    mechanism_ids: [vessel_count_is_not_delivery]
    if_observed: >-
      Microvascular density tracks freely with tracer or drug delivery into
      the same hypoxic nest, including under host anaemia.
    then_reject: >-
      The claim that angiogenic histology is decoupled from delivery.
nstg_touchpoints:
  - id: nstg_supportive_referral
    theme: supportive_referral
    role: constraint
    source_citation_id: nccp2018
    constraint_statement: >-
      National cancer-control policy treats suspected malignancy as a
      specialist-referral theme. This card does not triage neurosurgical
      urgency or choose radiotherapy.
  - id: nstg_palliative
    theme: palliative
    role: constraint
    source_citation_id: nstg2022
    constraint_statement: >-
      NSTG pain and palliative themes are knowledge constraints. Burden in
      a future model would not be a pain score and must not be mapped to one.
  - id: nstg_anaemia
    theme: anaemia
    role: constraint
    source_citation_id: eml2020
    constraint_statement: >-
      Anaemia is a host-constraint theme in Nigerian essential-medicine and
      NSTG-adjacent context. Haemoglobin is unobserved here and must not
      become an oxygen-delivery coefficient.
